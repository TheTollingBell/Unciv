name: Build iOS IPA (Unsigned)

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ return-ios ]
  pull_request:
    branches: [ return-ios ]
  workflow_dispatch:

# Cancel any in-progress run for the same ref so pushes don't queue behind each
# other (especially important given RoboVM's long compile times).
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# ─── Job ───────────────────────────────────────────────────────────────────────
jobs:
  build-ios:
    name: Build unsigned iOS IPA
    # iOS builds require macOS + Xcode. macos-14 is Apple Silicon (arm64) with
    # Xcode 15, matching the arm64 target architecture of modern iOS devices.
    runs-on: macos-14

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout return-ios branch
        uses: actions/checkout@v4
        with:
          ref: return-ios
          fetch-depth: 1

      # ── 2. Toolchain ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # ⚠️  Must be JDK 17, NOT 21.
          #
          # The return-ios branch pins Gradle 8.2 (August 2023). Gradle 8.2
          # ships buildSrc's kotlin-dsl plugin with KGP 1.9.0, whose JvmTarget
          # enum only has entries up to JVM_20. JVM_21 was added in KGP 1.9.20
          # (November 2023). When JDK 21 is the Gradle toolchain, Kotlin calls
          # JvmTarget.fromTarget("21"), which throws:
          #
          #   java.lang.IllegalArgumentException: Unknown Kotlin JVM target: 21
          #   at org.jetbrains.kotlin.gradle.dsl.JvmTarget$Companion.fromTarget
          #   Execution failed for task ':buildSrc:compileKotlin'
          #
          # JDK 17 wires to JvmTarget.JVM_17, which KGP 1.9.0 supports.
          # RoboVM also has better-tested support against JDK 17 bytecode.
          java-version: '17'
          distribution: 'temurin'
          # This built-in cache covers ~/.gradle/wrapper and ~/.gradle/caches.
          # The RoboVM cache (~/.robovm) is handled separately below.
          cache: gradle

      - name: Set up Android SDK
        # Gradle evaluates *all* subprojects (including android) even when only
        # ios:createIPA is invoked, so the Android SDK must be present.
        uses: android-actions/setup-android@v3

      # ── 3. Caching ────────────────────────────────────────────────────────────
      - name: Cache RoboVM AOT compilation output
        # RoboVM ahead-of-time-compiles every class in the classpath (your code
        # + LibGDX + all transitive deps) to ARM64 machine code via LLVM.
        # Without this cache the first run routinely takes 45–90 minutes.
        # Subsequent warm-cache runs finish in a few minutes.
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles(
                 'gradle/wrapper/gradle-wrapper.properties',
                 'buildSrc/**',
                 'ios/build.gradle',
                 'ios/build.gradle.kts',
                 'ios/robovm.xml',
                 'ios/robovm.properties'
               ) }}
          restore-keys: |
            robovm-${{ runner.os }}-

      # ── 4. Pre-flight ─────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Xcode version
        # Confirms which Xcode toolchain RoboVM will use for the final link.
        run: xcodebuild -version

      # ── 5. Inject unsigned-build setting ──────────────────────────────────────
      - name: Write Gradle init script to skip code signing
        # We inject iosSkipSigning = true via a Gradle user-level init script
        # rather than modifying any project-owned file. Init scripts run before
        # any build script, so this overrides whatever the project may set.
        # The equivalent manual change in ios/build.gradle would be:
        #
        #   robovm { iosSkipSigning = true }
        #
        # With iosSkipSigning = true the RoboVM Gradle plugin passes
        #   CODE_SIGN_IDENTITY=""  CODE_SIGNING_REQUIRED=NO
        # to the underlying xcodebuild invocation, producing a valid but
        # unsigned IPA sideloadable via AltStore / Sideloadly / a personal cert.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-ios-signing.gradle << 'INIT_SCRIPT'
          allprojects {
              afterEvaluate { proj ->
                  if (proj.plugins.hasPlugin("robovm")) {
                      def robovmExt = proj.extensions.findByName("robovm")
                      if (robovmExt != null) {
                          robovmExt.iosSkipSigning = true
                          logger.lifecycle("[CI] Forced iosSkipSigning=true on project '${proj.name}'")
                      }
                  }
              }
          }
          INIT_SCRIPT

      # ── 6. Build ──────────────────────────────────────────────────────────────
      - name: Build unsigned iOS IPA
        # ios:createIPA is the standard LibGDX/RoboVM task that:
        #   1. Runs the RoboVM AOT compiler (Kotlin/Java → ARM64 native)
        #   2. Places native output in ios/xcode/native/
        #   3. Invokes xcodebuild to archive and package the IPA
        run: |
          ./gradlew ios:createIPA \
            --no-daemon \
            --stacktrace
        # 90 min covers a cold run with an empty RoboVM cache. Warm cache runs
        # typically complete in under 15 minutes.
        timeout-minutes: 90

      # ── 7. Locate the IPA ─────────────────────────────────────────────────────
      - name: Locate generated IPA
        id: ipa
        run: |
          # RoboVM's default output is ios/build/robovm/<AppName>.ipa
          IPA_PATH=$(find ios/build/robovm -name "*.ipa" 2>/dev/null | head -1)

          # Fallback: search the whole workspace if the default path differs.
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find . -name "*.ipa" \
              -not -path "*/.git/*" \
              -not -path "*/robovm-build/tmp/*" \
              2>/dev/null | head -1)
          fi

          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa file was produced. Build output:"
            find ios/build -type f 2>/dev/null | head -40 || echo "(ios/build is empty)"
            exit 1
          fi

          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "::notice::IPA produced: $IPA_PATH ($IPA_SIZE)"

      # ── 8. Upload ─────────────────────────────────────────────────────────────
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-iOS-unsigned-${{ github.sha }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # ── 9. Debug dump (failure only) ──────────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            ios/build/
            ~/.robovm/logs/
          retention-days: 3
          if-no-files-found: ignore
