name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ return-ios ]
  pull_request:
    branches: [ return-ios ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-14   # Apple Silicon, Xcode 15

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout return-ios branch
        uses: actions/checkout@v4
        with:
          ref: return-ios
          fetch-depth: 1

      # ── 2. Toolchain ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # ⚠️  Must be JDK 17, NOT 21.
          #
          # The return-ios branch pins Gradle 8.2, which ships buildSrc's
          # kotlin-dsl plugin using KGP 1.9.0. That version's JvmTarget enum
          # only goes up to JVM_20; JVM_21 was added in KGP 1.9.20. With JDK 21
          # as the toolchain, Kotlin calls JvmTarget.fromTarget("21") and throws:
          #   "Unknown Kotlin JVM target: 21"
          #   Task :buildSrc:compileKotlin FAILED
          # JDK 17 wires to JvmTarget.JVM_17, supported by all KGP 1.x versions.
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        # Gradle evaluates all subprojects (including :android) even when only
        # ios:createIPA is invoked, so ANDROID_HOME must be present.
        uses: android-actions/setup-android@v3

      # ── 3. Caching ────────────────────────────────────────────────────────────
      - name: Cache RoboVM AOT compilation output
        # RoboVM AOT-compiles every class in the classpath to ARM64 via LLVM.
        # Without this cache the first run takes 45–90 min; warm runs ~15 min.
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ hashFiles(
                 'gradle/wrapper/gradle-wrapper.properties',
                 'buildSrc/**',
                 'ios/build.gradle.kts',
                 'ios/robovm.xml',
                 'ios/robovm.properties'
               ) }}
          restore-keys: |
            robovm-${{ runner.os }}-

      # ── 4. Pre-flight ─────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Xcode version
        run: xcodebuild -version

      # ── 5. Inject iosSkipSigning ──────────────────────────────────────────────
      - name: Write Gradle init script to skip code signing
        # A user-level init script avoids touching any project file.
        # Sets iosSkipSigning = true on every project with the RoboVM plugin,
        # which makes the plugin pass CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        # to xcodebuild, producing a valid unsigned IPA.
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-ios-signing.gradle << 'INIT_SCRIPT'
          allprojects {
              afterEvaluate { proj ->
                  if (proj.plugins.hasPlugin("robovm")) {
                      def robovmExt = proj.extensions.findByName("robovm")
                      if (robovmExt != null) {
                          robovmExt.iosSkipSigning = true
                          logger.lifecycle("[CI] Forced iosSkipSigning=true on project '${proj.name}'")
                      }
                  }
              }
          }
          INIT_SCRIPT

      # ── 6. Build ──────────────────────────────────────────────────────────────
      - name: Build unsigned iOS IPA
        run: |
          ./gradlew ios:createIPA \
            --no-daemon \
            --stacktrace
        timeout-minutes: 90

      # ── 7. Locate the IPA ─────────────────────────────────────────────────────
      - name: Locate generated IPA
        id: ipa
        run: |
          IPA_PATH=$(find ios/build/robovm -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find . -name "*.ipa" \
              -not -path "*/.git/*" \
              -not -path "*/robovm-build/tmp/*" \
              2>/dev/null | head -1)
          fi
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa file was produced. Build output:"
            find ios/build -type f 2>/dev/null | head -40 || echo "(ios/build is empty)"
            exit 1
          fi
          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "::notice::IPA produced: $IPA_PATH ($IPA_SIZE)"

      # ── 8. Upload ─────────────────────────────────────────────────────────────
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-iOS-unsigned-${{ github.sha }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # ── 9. Debug dump (failure only) ──────────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            ios/build/
            ~/.robovm/logs/
          retention-days: 3
          if-no-files-found: ignore
